name: Publish image

# Builds the app image on GitHub's machines (a 1 GB VM can't build it) and publishes it
# to ghcr.io so the small server only has to pull it.
on:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - package.json
      - package-lock.json
      - app/**
      - components/**
      - lib/**
      - server/**
      - shared/**
      - messages/**
      - i18n/**
      - public/**
      - next.config.mjs
      - tsconfig*.json
      - .github/workflows/publish-image.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ghcr.io/pranav-singh-devloper/task_manager:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
