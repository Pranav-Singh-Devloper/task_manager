# Runs the app and a small web server that gets a free HTTPS certificate automatically.
services:
  app:
    # Built by GitHub (see .github/workflows/publish-image.yml) because a 1 GB VM can't build it.
    image: ghcr.io/pranav-singh-devloper/task_manager:latest
    build: ../..
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: "3000"
      DATA_DIR: /data
    volumes:
      - mm-data:/data
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    command: caddy reverse-proxy --from ${DOMAIN} --to app:3000
    volumes:
      - caddy-data:/data
    depends_on:
      - app
volumes:
  mm-data:
  caddy-data:
